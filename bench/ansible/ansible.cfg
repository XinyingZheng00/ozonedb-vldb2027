# Ansible reads this file only from the cwd, and not from a world-writable
# one. Run the playbooks from bench/ansible/, or export
# ANSIBLE_CONFIG=$OZONEDB_HOME/bench/ansible/ansible.cfg.

[defaults]
inventory = ./inventory.py
host_key_checking = False
# One fork per host, so all hosts sync concurrently.
forks = 32
stdout_callback = yaml
interpreter_python = auto_silent
retry_files_enabled = False
# CloudLab nodes come and go; do not cache facts across re-swaps.
gathering = explicit

[ssh_connection]
pipelining = True
# ControlPersist: every task after the first reuses one SSH connection. rsync
# reuses it too, through use_ssh_args on the synchronize tasks.
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
