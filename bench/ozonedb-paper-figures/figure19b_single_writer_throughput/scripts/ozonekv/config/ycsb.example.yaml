# ===========================================================================
# OzoneKV benchmark configuration -- TEMPLATE
#
# Copy this file to ycsb.yaml (gitignored) next to it. Fill in the `nodes:`
# block for your cluster. Every runner refuses to start without ycsb.yaml.
# bench/scripts/local/* and bench/ansible/* read it, always through
# bench/scripts/ycsb_config.py and never through yaml.safe_load directly.
# ===========================================================================

# --------------------------------------------------------------- defaults --
# YAML merge keys (`<<:`) merge this block into local.load and local.run below.
defaults: &defaults
  key_size: ["1KB"]
  # ozonedb-corfu | cassandra | rocksdb | ozonedb | sqlite. For one sweep,
  # pass --db_name to the runners instead of an edit here. The multinode
  # wrappers do that. A YAML edit has to be synced to every client.
  db_name: ["ozonedb-corfu"]
  threads: [1] # sweep with e.g. [1, 4, 8, 16, 32, 64]
  # Must stay 1 for the run phase. run_local_ycsb_multiproc.py refuses
  # any other value, because every repeat rewrites the same _trial{N} result
  # files. Express repetition as trials (--trial N / --trials N).
  repeated: 1
  ycsb_data_path: "/tmp/ycsb_data"

local:
  load:
    <<: *defaults
    # LIST. load_local_ycsb*.py iterates this ("for each_record_cnt in ...").
    record_cnt: [1000000]
    # Parallel writer processes. Before, this key was absent and defaulted silently to 2.
    num_writers: 2

  run:
    <<: *defaults
    # SCALAR. run_local_ycsb_multiproc.py does int(record_cnt) on it directly.
    # A list here, to match load.record_cnt above, breaks the run phase.
    # The two phases differ on purpose. That is not a typo.
    record_cnt: 1000000
    workload_name: ["c"] # a b c d f
    operation_cnt: [999999999]
    # Cap each YCSB run at this many seconds (YCSB -p maxexecutiontime).
    # Unset or 0 means that only operation_cnt bounds the runs. For one sweep,
    # run_multinode_ycsb_with_corfu.sh --duration (run_multinode_ycsb.py
    # --max_exec_time) overrides this on every client without an edit.
    max_exec_time: 300

    # Writer-process counts.
    num_writers: 2 # single-node runner
    writers_per_host: 1 # multi-node runner, per host
    trial: 1

# ----------------------------------------------------------------- nodes --
# THE source of truth for every address in the cluster. Each machine is named
# once. bench/scripts/ycsb_config.py derives everything else:
#
#   cloudlab.hosts  <- clients[].ssh      corfu.endpoint <- log.lan   : corfu.port
#   cloudlab.*      <- ssh_user, key      s3.endpoint    <- store.lan : s3.port
#
# Each node has two addresses, because they are not interchangeable:
#   ssh   how YOU reach it        -- public CloudLab name, routable from a laptop
#   lan   how OTHER NODES reach it -- internal 10.10.1.x
# `corfu_server -a <addr>` binds the address it gets. So that address must be
# the LAN one, or no client can connect. The sweep script must SSH to the same
# box, which from off-cluster needs the public one. This file records both
# addresses once, so the sweep wrappers never hardcode the corfu host.
#
# You can omit `ssh:`. Then the scripts use `lan:` for SSH too. That is the
# old behaviour, and it works when you orchestrate from inside CloudLab. Add
# the public names to drive a sweep from your laptop.
nodes:
  ssh_user: "YOUR_SSH_USER"
  ssh_private_key_path: "~/.ssh/id_ed25519"

  # CorfuDB
  log:
    ssh: "node0.example.cloudlab.us"
    lan: "10.10.1.1"

  # Object Store (the paper puts it on the same box as CorfuDB)
  store:
    ssh: "node0.example.cloudlab.us"
    lan: "10.10.1.1"

  # Cassandra baseline server(s). This is a LIST. One entry is the common case.
  # Optional: when absent, the loader uses `log`. Then Cassandra takes the box
  # of CorfuDB, and both systems get identical server hardware. Never run both
  # servers at once. For an RF=3 run, add nodes and raise cassandra.replication_factor.
  cassandra:
    - ssh: "node0.example.cloudlab.us"
      lan: "10.10.1.1"

  # One entry per YCSB client machine. The paper used eight.
  clients:
    - ssh: "node1.example.cloudlab.us"
      lan: "10.10.1.2"
    - ssh: "node2.example.cloudlab.us"
      lan: "10.10.1.3"

# ------------------------------------------------------------------ corfu --
corfu:
  port: 9090
  stream_name: "ozonedb-ycsb"
  # Log trimming. Prefer --log-trim on
  # load_local_ycsb_multiproc.py / run_local_ycsb_multiproc.py /
  # run_multinode_ycsb.py over `enabled: true` here. The flag needs no sync
  # to every client. Only global writer 0 gets log_trim_enabled=true in its
  # generated config. Every writer loads the newest checkpoint at open. The
  # checkpoint lives in the SSTable bucket under <sstable_dir>/checkpoint/.
  # So a load snapshot must copy the bucket AND the Corfu log dir together.
  log_trim:
    enabled: false
    interval_ms: 30000
    min_entries: 100000
    keep_checkpoints: 2
  # Read mode: leave it unset here. Pass --linearizable to
  # run_multinode_ycsb_with_corfu.sh / run_multinode_ycsb.py /
  # run_local_ycsb_multiproc.py (or consistency.py). The flag sets
  # linearizable_reads=true and trust_background_tail=false in the generated
  # shared_config of every writer, AND it labels the result files
  # ozonedb-corfu-linearizable. The runners honour `linearizable_reads: true`
  # here and label it the same way, but you have to sync it to every client
  # per cell. A forgotten sync is how two identical "default" sweeps happen.

# --------------------------------------------------------------------- s3 --
# S3-compatible store for SSTables
# `bash bench/scripts/setup.sh --role minio`
# provisions this on a node and creates the bucket named below.
s3:
  scheme: "http"
  port: 9000
  region: "us-east-1"
  bucket: "ozonedb-ycsb"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_path_style: true
  sstable_dir: "sstables"

# -------------------------------------------------------------- cassandra --
# Server-based baseline for the consistency/throughput frontier.
#   bash bench/scripts/setup.sh --role cassandra        # on each nodes.cassandra
#   bash bench/scripts/local/load_multinode_cassandra.sh
#   bash bench/scripts/local/run_multinode_ycsb_with_cassandra.sh --consistency serial
# The loader derives hosts / ssh_hosts / contact_points from nodes:. Never set
# them here. ycsb/cassandra/README.md documents the knobs of the binding.
cassandra:
  version: "5.0.5"
  install_dir: "/tank/cassandra"
  port: 9042
  keyspace: "ycsb"
  replication_factor: 1
  # Consistency mode: one | quorum | serial.
  #   one     read ONE,    write ONE            (eventual)
  #   quorum  read QUORUM, write QUORUM         (default; == one at RF=1)
  #   serial  read SERIAL, write QUORUM + LWT   (linearizable: Paxos per write)
  # Pass --consistency to the sweep wrapper instead of an edit here. An edit
  # has to be synced to every client. The result label comes from the
  # effective mode either way (cassandra-one / -quorum / -serial).
  consistency: "quorum"
  # Server JVM heap (MAX_HEAP_SIZE / HEAP_NEWSIZE, which cassandra-env.sh
  # requires as a pair). 31G keeps compressed oops. The default of Cassandra
  # itself caps at 8G, which would handicap the baseline.
  heap: "31G"
  new_heap: "8G"
  # Columns in usertable. The value must equal fieldcount in the YCSB workload template.
  fields: 10

# ------------------------------------------- compaction-contention overrides
# Only run_corfu_compaction_contention.py reads this block. It merges these
# values INTO the corfu settings before _make_corfu_config_per_writer writes
# the per-writer JSON. The regular run_local_ycsb_multiproc.py path ignores it.
#
# This block tunes ozonedb to fire many small compactions per writer (target
# 20-50 per trial). That is what makes the contention measurement meaningful.
# The shared_config_base.json defaults (32 MB log files, 256 MB L1, 64 MB
# output) would produce only a handful across a 1M-record run.
#
# level_size and level_file_size_limit are STRINGS. Metadata parses
# shared_config_base.json and splits "[a, b, ...]" into a vector at load time.
corfu_compaction_experiment:
  log_file_size_limit: 2097152 # 2 MiB
  base_file_number_limit: 2
  level_size: "[8388608, 33554432, 134217728]" # 8 MiB / 32 MiB / 128 MiB
  level_file_size_limit: "[2097152, 4194304, 8388608]" # 2 MiB / 4 MiB / 8 MiB
  max_level: 3
