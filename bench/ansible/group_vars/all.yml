---
# Shared by sync.yml and bootstrap.yml. A play's own `vars:` and -e both
# override these group_vars.

# Where the tree lands. Empty: probe the remote for OZONEDB_HOME, else
# $HOME/<repo_dest_name>.
remote_repo_path: ""
repo_dest_name: ozonedb

# --------------------------------------------------------------- exclusions
#
# Never useful on a bench node: build output, results, editor and agent
# scratch, and compiled objects the node builds itself.
rsync_excludes_base:
  - --exclude=build/
  - --exclude=**/build/
  - --exclude=target/
  - --exclude=**/target/
  - --exclude=**/__pycache__/
  # The node clones its own vcpkg (setup.sh); a local checkout holds
  # platform-specific binaries.
  - --exclude=/vcpkg/
  # Anchored, and only the generated files: an unanchored "ycsb/workloads/"
  # also matches the Java package directory ycsb/core/.../site/ycsb/workloads/.
  # generate_workload.py needs the workload templates on the node.
  - --exclude=/ycsb/workloads/generated_workloads/
  - --exclude=bench/results/
  - --exclude=src/include/ozonedb/protobuf/
  - --exclude=.claude/
  - --exclude=.DS_Store
  - --exclude=.idea/
  - --exclude=.vscode/
  - --exclude=.env
  - --exclude=tmp/
  - --exclude=*.pyc
  - --exclude=*.so
  - --exclude=*.o
  - --exclude=*.a
  - --exclude=CLAUDE.md

# Incremental (sync.yml): the node already has .git from the bootstrap.
rsync_excludes_incremental: "{{ rsync_excludes_base + ['--exclude=.git'] }}"

# Bootstrap (bootstrap.yml): everything the build needs, nothing platform-local.
rsync_excludes_bootstrap: "{{ rsync_excludes_base }}"
