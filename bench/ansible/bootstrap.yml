---
# Stand up a freshly provisioned CloudLab node straight from this working tree.
# No git clone on the node, no GitHub credentials, no PAT leaving your laptop.
#
#   cd $OZONEDB_HOME/bench/ansible
#   ansible-playbook bootstrap.yml                          # push + setup.sh --role client
#   ansible-playbook bootstrap.yml --limit <host> \
#     -e '{"setup_roles":["corfu-server","minio"]}'         # the log/store node
#   ansible-playbook bootstrap.yml -e run_setup=false       # push only
#   ansible-playbook bootstrap.yml -e include_git=false     # skip .git (~40 MB)
#
# The working tree is rsynced without vcpkg/ and build/: setup.sh clones vcpkg
# at the baseline pinned in vcpkg.json and builds the dependencies on the node.
# Use sync.yml for every push after this one.
#
# setup.sh takes a long time on first run (the vcpkg dependency build, and
# CorfuDB on the log node), so it runs detached via async rather than holding
# an SSH channel open for the whole build.

- name: Bootstrap CloudLab nodes from the local working tree
  hosts: "{{ target | default('clients') }}"
  gather_facts: false
  strategy: free

  vars:
    repo_src: "{{ playbook_dir }}/../../"
    # Defaults to the roles the inventory assigns from `nodes:` -- client for
    # nodes.clients, corfu-server for nodes.log, minio for nodes.store; a host
    # in several groups gets all of its roles. So `-e target=nodes` provisions
    # the whole cluster correctly in one pass.
    setup_roles: "{{ ozonedb_roles | default([ozonedb_role | default('client')]) }}"
    setup_extra_args: ""
    run_setup: true
    include_git: true
    delete: false
    setup_timeout: 7200

  tasks:
    - name: Resolve the destination path
      ansible.builtin.include_tasks: tasks/resolve_dest.yml

    - name: Ensure the destination directory exists
      ansible.builtin.file:
        path: "{{ repo_dest }}"
        state: directory
        mode: "0755"

    - name: Push the working tree
      ansible.posix.synchronize:
        src: "{{ repo_src }}"
        dest: "{{ repo_dest }}/"
        owner: false
        group: false
        compress: true
        delete: "{{ delete | bool }}"
        use_ssh_args: true
        rsync_opts: >-
          {{ rsync_excludes_bootstrap
             + ([] if (include_git | bool) else ['--exclude=.git']) }}

    - name: Report what landed
      ansible.builtin.raw: >-
        bash -lc 'cd {{ repo_dest | quote }} &&
        echo "files: $(find . -type f | wc -l)" &&
        echo "git repo: $([ -d .git ] && echo yes || echo no)"'
      register: landed
      changed_when: false

    - name: Show it
      ansible.builtin.debug:
        msg: "{{ landed.stdout_lines | default([]) | select('search', ':') | list }}"

    - name: Run setup.sh
      ansible.builtin.shell: >-
        bash -lc 'cd {{ repo_dest | quote }} &&
        bash bench/scripts/setup.sh --role {{ setup_roles | join(' --role ') }} {{ setup_extra_args }}'
      register: setup_result
      changed_when: true
      when: run_setup | bool
      async: "{{ setup_timeout }}"
      poll: 30

    - name: Show the tail of each setup run
      ansible.builtin.debug:
        msg: "{{ setup_result.stdout_lines[-25:] | default([]) }}"
      when: run_setup | bool
