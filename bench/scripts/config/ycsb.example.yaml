# ===========================================================================
# OzoneKV benchmark configuration: TEMPLATE
#
# Copy this file to ycsb.yaml (gitignored) next to it and fill in the
# `nodes:` block for your cluster. Every runner refuses to start without
# ycsb.yaml. bench/scripts/local/* and bench/ansible/* read it through
# bench/scripts/ycsb_config.py, never through yaml.safe_load directly.
# ===========================================================================

# --------------------------------------------------------------- defaults --
# Merged into local.load and local.run below through YAML merge keys (`<<:`).
defaults: &defaults
  key_size: ["1KB"]
  # ozonedb-corfu | cassandra | rocksdb | ozonedb | sqlite. For one sweep,
  # pass --db_name to the runners instead (the multinode wrappers do): a
  # YAML edit has to be synced to every client.
  db_name: ["ozonedb-corfu"]
  threads: [1] # sweep with e.g. [1, 4, 8, 16, 32, 64]
  # Must stay 1 for the run step: run_local_ycsb_multiproc.py refuses
  # anything else, because every repeat rewrites the same _trial{N} result
  # files. Use trials (--trial N / --trials N) for repetition.
  repeated: 1
  ycsb_data_path: "/tmp/ycsb_data"

local:
  load:
    <<: *defaults
    # LIST. load_local_ycsb*.py iterates over it.
    record_cnt: [1000000]
    # Parallel writer processes.
    num_writers: 2

  run:
    <<: *defaults
    # SCALAR. run_local_ycsb_multiproc.py calls int(record_cnt) on it. A list
    # here breaks the run step; load.record_cnt and run.record_cnt differ by
    # design.
    record_cnt: 1000000
    workload_name: ["c"] # a b c d f
    operation_cnt: [999999999]
    # Cap each YCSB run at this many seconds (YCSB -p maxexecutiontime).
    # Unset or 0 means operation_cnt alone bounds the run. For one sweep,
    # run_multinode_ycsb_with_corfu.sh --duration (run_multinode_ycsb.py
    # --max_exec_time) overrides this on every client.
    max_exec_time: 300

    # Writer-process counts.
    num_writers: 2 # single-node runner
    writers_per_host: 1 # multi-node runner, per host
    trial: 1

# ----------------------------------------------------------------- nodes --
# The source of truth for every address in the cluster. Each machine is named
# once; bench/scripts/ycsb_config.py derives everything else:
#
#   cloudlab.hosts  <- clients[].ssh      corfu.endpoint <- log.lan   : corfu.port
#   cloudlab.*      <- ssh_user, key      s3.endpoint    <- store.lan : s3.port
#
# Two addresses per node, because they are not interchangeable:
#   ssh   how YOU reach it: the public CloudLab name, routable from a laptop
#   lan   how OTHER NODES reach it: the internal 10.10.1.x address
# `corfu_server -a <addr>` binds the address it is given, so it must be the
# LAN one or no client can connect. The sweep script must SSH to the same box,
# which from off-cluster needs the public one.
#
# `ssh:` may be omitted; then `lan:` is used for SSH too, which works when you
# orchestrate from inside CloudLab. Add the public names to drive a sweep
# from your laptop.
nodes:
  ssh_user: "YOUR_SSH_USER"
  ssh_private_key_path: "~/.ssh/id_ed25519"

  # CorfuDB
  log:
    ssh: "node0.example.cloudlab.us"
    lan: "10.10.1.1"

  # Object store (the paper puts it on the same box as CorfuDB)
  store:
    ssh: "node0.example.cloudlab.us"
    lan: "10.10.1.1"

  # Cassandra baseline servers: a LIST, one entry is the common case.
  # Optional: when absent, `log` is used, so Cassandra takes CorfuDB's box.
  # Never run both servers at once. Add nodes (and raise
  # cassandra.replication_factor) for an RF=3 run.
  cassandra:
    - ssh: "node0.example.cloudlab.us"
      lan: "10.10.1.1"

  # One entry per YCSB client machine. The paper used eight.
  clients:
    - ssh: "node1.example.cloudlab.us"
      lan: "10.10.1.2"
    - ssh: "node2.example.cloudlab.us"
      lan: "10.10.1.3"

# ------------------------------------------------------------------ corfu --
corfu:
  port: 9090
  stream_name: "ozonedb-ycsb"
  # Log trimming. Prefer --log-trim on load_local_ycsb_multiproc.py /
  # run_local_ycsb_multiproc.py / run_multinode_ycsb.py over `enabled: true`
  # here: the flag needs no sync to every client. Only global writer 0 gets
  # log_trim_enabled=true in its generated config; every writer loads the
  # newest checkpoint at open. The checkpoint lives in the SSTable bucket
  # under <sstable_dir>/checkpoint/, so a load snapshot must copy the bucket
  # AND the Corfu log dir together.
  log_trim:
    enabled: false
    interval_ms: 30000
    min_entries: 100000
    keep_checkpoints: 2
  # Read mode: leave unset here. Pass --linearizable to
  # run_multinode_ycsb_with_corfu.sh / run_multinode_ycsb.py /
  # run_local_ycsb_multiproc.py (or consistency.py). It sets
  # linearizable_reads=true + trust_background_tail=false in every writer's
  # generated shared_config and labels the result files
  # ozonedb-corfu-linearizable. `linearizable_reads: true` here is honoured
  # and labelled the same way, but it has to be synced to every client.

# --------------------------------------------------------------------- s3 --
# S3-compatible store for SSTables. `bash bench/scripts/setup.sh --role minio`
# provisions it on a node and creates the bucket named below.
s3:
  scheme: "http"
  port: 9000
  region: "us-east-1"
  bucket: "ozonedb-ycsb"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_path_style: true
  sstable_dir: "sstables"

# -------------------------------------------------------------- cassandra --
# Server-based baseline for the consistency/throughput frontier.
#   bash bench/scripts/setup.sh --role cassandra        # on each nodes.cassandra
#   bash bench/scripts/local/load_multinode_cassandra.sh
#   bash bench/scripts/local/run_multinode_ycsb_with_cassandra.sh --consistency serial
# hosts / ssh_hosts / contact_points are derived from nodes: and must not be
# set here. ycsb/cassandra/README.md documents the binding's keys.
cassandra:
  version: "5.0.5"
  install_dir: "/tank/cassandra"
  port: 9042
  keyspace: "ycsb"
  replication_factor: 1
  # Consistency mode: one | quorum | serial.
  #   one     read ONE,    write ONE            (eventual)
  #   quorum  read QUORUM, write QUORUM         (default; == one at RF=1)
  #   serial  read SERIAL, write QUORUM + LWT   (linearizable: Paxos per write)
  # Pass --consistency to the sweep wrapper instead of editing this: an edit
  # has to be synced to every client, and the result label comes from the
  # effective mode either way (cassandra-one / -quorum / -serial).
  consistency: "quorum"
  # Server JVM heap (MAX_HEAP_SIZE / HEAP_NEWSIZE, a pair cassandra-env.sh
  # requires). 31G keeps compressed oops; Cassandra's own default caps at 8G.
  heap: "31G"
  new_heap: "8G"
  # Columns in usertable; must equal fieldcount in the YCSB workload template.
  fields: 10

# ------------------------------------------- compaction-contention overrides
# Read only by run_corfu_compaction_contention.py, which merges these into the
# corfu settings before _make_corfu_config_per_writer writes the per-writer
# JSON. run_local_ycsb_multiproc.py ignores this block.
#
# These values make ozonedb run many small compactions per writer (20-50 per
# trial), which the contention measurement needs. The shared_config_base.json
# defaults (32 MB log files, 256 MB L1, 64 MB output) would give only a few
# across a 1M-record run.
#
# level_size and level_file_size_limit are STRINGS: Metadata parses
# shared_config_base.json and splits "[a, b, ...]" into a vector at load time.
corfu_compaction_experiment:
  log_file_size_limit: 2097152 # 2 MiB
  base_file_number_limit: 2
  level_size: "[8388608, 33554432, 134217728]" # 8 MiB / 32 MiB / 128 MiB
  level_file_size_limit: "[2097152, 4194304, 8388608]" # 2 MiB / 4 MiB / 8 MiB
  max_level: 3
